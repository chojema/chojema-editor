<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D6AF8"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FB"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9CCF3"/>
      <stop offset="1" stop-color="#A5A9EA"/>
    </linearGradient>
    <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C6CF6"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#F2711C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B0930" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
  </g>

  <!-- page with folded corner -->
  <g filter="url(#soft)">
    <path d="M 318 236 H 618 L 718 336 V 752 A 36 36 0 0 1 682 788 H 318 A 36 36 0 0 1 282 752 V 272 A 36 36 0 0 1 318 236 Z" fill="url(#page)"/>
  </g>
  <path d="M 618 236 V 304 A 32 32 0 0 0 650 336 H 718 Z" fill="url(#fold)"/>

  <!-- content: heading, text lines, caret -->
  <rect x="342" y="352" width="210" height="40" rx="20" fill="url(#heading)"/>
  <rect x="342" y="436" width="316" height="22" rx="11" fill="#C8CCE6"/>
  <rect x="342" y="490" width="268" height="22" rx="11" fill="#C8CCE6"/>
  <rect x="342" y="544" width="300" height="22" rx="11" fill="#C8CCE6"/>
  <rect x="342" y="598" width="150" height="22" rx="11" fill="#C8CCE6"/>
  <rect x="506" y="588" width="8" height="42" rx="4" fill="#4F46E5"/>

  <!-- pen nib -->
  <g transform="translate(706 628) rotate(38)" filter="url(#soft)">
    <rect x="-58" y="-222" width="116" height="66" rx="18" fill="#17154A"/>
    <rect x="-58" y="-222" width="116" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <path d="M -58 -150 H 58 L 64 -60 Q 64 -10 26 60 L 0 168 L -26 60 Q -64 -10 -64 -60 Z" fill="url(#nib)"/>
    <path d="M -58 -150 H 0 V 168 L -26 60 Q -64 -10 -64 -60 Z" fill="#FFFFFF" fill-opacity="0.16"/>
    <line x1="0" y1="2" x2="0" y2="160" stroke="#7A2E0B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="-16" r="19" fill="#7A2E0B"/>
  </g>
</svg>
